# Arguments every native build of jburrow-cli needs. Flags for one build belong in the native profile.
#
# netty-codec-http's own configuration initializes all of io.netty at build time, so Netty's static
# loggers are created during the build and bind to SLF4J then. The SLF4J classes that binding
# initializes are therefore build-time too; slf4j-simple's settings come from the bundled
# simplelogger.properties either way.
#
# JdkSslServerContext can't be build-time: its initializer parses a certificate into Netty buffers,
# which Netty requires at run time.
#
# --install-exit-handlers makes SIGINT and SIGTERM run shutdown hooks, as they do on the JVM. Without
# it, Ctrl-C kills the binary before ShutdownHook closes the tunnel and reports the final event.
Args = --initialize-at-build-time=org.slf4j.LoggerFactory,org.slf4j.helpers.Reporter,org.slf4j.simple.SimpleLogger \
       --initialize-at-run-time=io.netty.handler.ssl.JdkSslServerContext \
       --install-exit-handlers
