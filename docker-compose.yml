# Local development dependencies only. These credentials unlock nothing outside this machine.
name: jburrow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jburrow
      POSTGRES_USER: jburrow
      POSTGRES_PASSWORD: jburrow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jburrow -d jburrow"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
